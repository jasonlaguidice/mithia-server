version: '3.8'
services:
  # Portainer - Docker Management UI
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      mithia_network:
        ipv4_address: 172.20.0.50
    ports:
      - "9443:9443"     # HTTPS Web UI
      - "8000:8000"     # Edge Agent (optional)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "portainer_data:/data"
    environment:
      - PORTAINER_HTTP_ENABLED=false  # Disable HTTP, use HTTPS only
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://localhost:9443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Login Server - Handles user authentication
  mithia-login:
    build:
      context: .
      dockerfile: services/login-server/Dockerfile
    image: mithia-login-server:latest
    container_name: mithia-login
    restart: unless-stopped
    mem_limit: 4g
    networks:
      mithia_network:
        ipv4_address: 172.20.0.10
    ports:
      - "2000:2000"
    environment:
      - LOGIN_SERVER_HOST=mithia-login
      - CHAR_SERVER_HOST=mithia-char
      - CHAR_SERVER_PORT=2005
      - DB_HOST=mithia-db
      - DB_PORT=3306
      - PUBLIC_LOGIN_IP=184.107.141.66
      - PUBLIC_MAP_IP=184.107.141.66
    volumes:
      - "./rtk/conf:/home/RTK/rtk/conf"
      - "./rtk/logs/login:/home/RTK/rtk/logs"
    depends_on:
      mithia-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.mithia.service=login-server"
      - "com.mithia.description=Handles user authentication"

  # Character Server - Manages character data and bridges login/map
  mithia-char:
    build:
      context: .
      dockerfile: services/char-server/Dockerfile
    image: mithia-char-server:latest
    container_name: mithia-char
    restart: unless-stopped
    mem_limit: 4g
    networks:
      mithia_network:
        ipv4_address: 172.20.0.20
    ports:
      - "2005:2005"
    environment:
      - LOGIN_SERVER_HOST=mithia-login
      - LOGIN_SERVER_PORT=2000
      - MAP_SERVER_HOST=mithia-map
      - MAP_SERVER_PORT=2001
      - DB_HOST=mithia-db
      - DB_PORT=3306
      - PUBLIC_LOGIN_IP=184.107.141.66
      - PUBLIC_MAP_IP=184.107.141.66
    volumes:
      - "./rtk/conf:/home/RTK/rtk/conf"
      - "./rtk/logs/char:/home/RTK/rtk/logs"
    depends_on:
      mithia-db:
        condition: service_healthy
      mithia-login:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2005"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.mithia.service=char-server"
      - "com.mithia.description=Manages character data"

  # Map Server - Game world simulation (scalable)
  mithia-map:
    build:
      context: .
      dockerfile: services/map-server/Dockerfile
    image: mithia-map-server:latest
    container_name: mithia-map
    restart: unless-stopped
    mem_limit: 4g
    networks:
      mithia_network:
        ipv4_address: 172.20.0.30
    ports:
      - "2001:2001"
      - "9001:9000"    # Changed metrics port to avoid conflict with Portainer
    environment:
      - LOGIN_SERVER_HOST=mithia-login
      - LOGIN_SERVER_PORT=2000
      - CHAR_SERVER_HOST=mithia-char
      - CHAR_SERVER_PORT=2005
      - DB_HOST=mithia-db
      - DB_PORT=3306
      - PUBLIC_LOGIN_IP=184.107.141.66
      - PUBLIC_MAP_IP=184.107.141.66
    env_file:
      - stack.env.production
    volumes:
      - "./rtk/conf:/home/RTK/rtk/conf"
      - "./rtk/logs/map:/home/RTK/rtk/logs"
      - "./rtk/SObj.tbl:/home/RTK/rtk/SObj.tbl:ro"
    depends_on:
      mithia-char:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.mithia.service=map-server"
      - "com.mithia.description=Game world simulation"
      - "com.mithia.scalable=true"

  # Database Server - MySQL
  mithia-db:
    image: mysql/mysql-server:8.0
    container_name: mithia-db
    restart: unless-stopped
    networks:
      mithia_network:
        ipv4_address: 172.20.0.5
    ports:
      - "3306:3306"
    env_file:
      - stack.env.production
    volumes:
      - "./mithia-data/database/scripts:/docker-entrypoint-initdb.d"
      - "mysql_data:/var/lib/mysql"
      - "./mithia-data/data/backups:/backups"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - "com.mithia.service=database"
      - "com.mithia.description=MySQL database server"

  # Web PHP-FPM for dashboard
  mithia-web-php:
    build:
      context: .
      dockerfile: web/php/Dockerfile
    image: mithia-web-php:latest
    container_name: mithia-web-php
    restart: unless-stopped
    networks:
      mithia_network:
        ipv4_address: 172.20.0.40
    volumes:
      - "./web/public:/var/www/html"
      - "/var/run/docker.sock:/var/run/docker.sock"
    depends_on:
      - mithia-db
    labels:
      - "com.mithia.service=web-php"
      - "com.mithia.description=PHP backend for web dashboard"

  # Web Nginx for dashboard
  mithia-web-nginx:
    image: nginx:alpine
    container_name: mithia-web-nginx
    restart: unless-stopped
    depends_on:
      - mithia-web-php
    networks:
      mithia_network:
        ipv4_address: 172.20.0.41
    ports:
      - "8080:80"
    volumes:
      - "./web/public:/var/www/html:ro"
      - "./web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./web/nginx/.htpasswd:/etc/nginx/.htpasswd:ro"
    environment:
      - MITHIA_MAP_METRICS_URL=http://mithia-map:9000/metrics/players
    labels:
      - "com.mithia.service=web-nginx"
      - "com.mithia.description=Web server for dashboard"


networks:
  mithia_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  mysql_data:
    driver: local
  portainer_data:
    driver: local

# Docker Compose with Portainer Integration
#
# Key Changes from Production:
# 1. Portainer service added on port 9443 (HTTPS)
# 2. Map server metrics port changed from 9000 to 9001 (to avoid conflict)
# 3. Labels added to all services for better Portainer organization
# 4. Portainer volume for persistent data
#
# Access Points:
#   Portainer:      https://184.107.141.66:9443
#   Login Server:   184.107.141.66:2000
#   Char Server:    184.107.141.66:2005
#   Map Server:     184.107.141.66:2001
#   Metrics:        http://184.107.141.66:9001/metrics/players
#   Web Dashboard:  http://184.107.141.66:8080
#
# Usage:
#   Deploy:  docker compose -f docker-compose.portainer.yml up -d
#   Logs:    docker compose -f docker-compose.portainer.yml logs -f
#   Stop:    docker compose -f docker-compose.portainer.yml down
#
# First-time Portainer Setup:
#   1. Navigate to https://184.107.141.66:9443
#   2. Create admin account
#   3. Select "Get Started" to connect to local Docker
#   4. View and manage all containers from the web UI
